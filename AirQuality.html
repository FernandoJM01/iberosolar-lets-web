<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="./icons/logo-lets.png">
    <title>Air Quality IBERO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,300&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&family=Roboto:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />   
    <link rel="stylesheet" href="./Styles/AirQuality.css">
    <link rel="stylesheet" href="./Styles/LetsIbero.css">
    <link rel="stylesheet" href="./Styles/GraphCircle.css">
    <link rel="stylesheet" href="./Styles/pop-upGraph.css">
    <link rel="stylesheet" href="./Animation/sunrise.css">

  </head>
  <body>
    <!-- Navbar Section -->
    <div id="navbarContainer"></div>
    <div class="cards-container">
  
      <div class="max-widthCard">
        <div class="cards">
          <!-- Weather Box -->
          <div class="container temperature">
            <div class="info-weather">
              <img src="./images/Cloud.png">
              <p class="info-Temp" ><span id="Temp"></span> <span>°C</span></p>
              <p class="description">Temperatura</p>
            </div>
          </div>

          <!-- Humidity Box -->
          <div class="container humidity">
            <div class="body-card">
              <i class='bx bx-water'></i>
              <div class="info">
                <div class="card-text3">
                  <p><span id="Humidity"></span> %</p>
                </div>
                <p>Humedad</p>
              </div>
            </div>
          </div>

          <!-- Feels like Box -->
          <div class="container feels">
            <div class="body-card">
              <i class='bx bxs-thermometer'></i>
              <div class="info">
                <div class="card-text3">
                  <p> <span id="Feels"></span>°C </p>
                </div>
                <p>Sensación <br> Térmica</p>
              </div>
            </div>
          </div>

          <!-- AirQuality Box-->
          <div class="container airquality">
            <div class="chartBox">
              <div class="box_background">
                <canvas id="myChart_Back"></canvas>  
              </div>
              <div class="box_dough">
                <canvas id="myChart"></canvas>
              </div> 
              <div class="box_mid_c">
                <canvas id="myChart_Mid"></canvas>
              </div> 
              <div class="box_mid_b">
                <canvas id="circleBottom"></canvas>
              </div> 
            </div>
          </div>

          <!-- Irradiance Box -->
          <div class="container irradiance">
            <p><span id="Irradiance"></span></p>
            <img id="IrradianceGraph" src="" alt="Irradiance Graph">
          </div>

          <!-- Rainfall Box -->
          <div class="container rainfall">
            <div class="body-card">
              <i class="fa-solid fa-cloud-rain"></i>
              <div class="info">
                <div class="card-text3">
                  <p><span id="Precipitation"></span> mm</p>
                </div>
                <p>Precipitación</p>
              </div>
            </div>
          </div>

          <!-- Wind Box -->
          <div class="container wind">
            <div class="body-card">
              <i class='bx bx-wind'></i>
              <div class="info">
                <div class="card-text3">
                  <p> <span id="Wind_Speed"></span> km/h</p>
                </div>
                <p>Viento</p>
              </div>
            </div>
          </div>

          <!-- Atmospheric pressure -->
          <div class="container pressure">
            <div class="body-card">
              <object class="pressure-icon" type="image/svg+xml" data="./icons/AirQuality/pressure2.svg"></object>
              <div class="info">
                <div class="card-text3">
                  <p><span id="Pressure"></span> mbar</p>
                </div>
                <p>Presión</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Background Animation -->
      <div class="sky">
        <div class="sky__phase sky__dawn"></div>
        <div class="sky__phase sky__noon"></div>
        <div class="sky__phase sky__dusk"></div>
        <div class="sky__phase sky__midnight">
          <div id="sky__stars"></div>
        </div>
        <div class="orbit">
          <div class="sun"></div>
          <div class="moon"></div>
        </div>
      </div> 
    </div>

    <!-- Pop Up Graph-->
    <div class="pop-upGraphContainer">
      <div class="pop-upGraph">
        <div class="pop-upGraph_title"> Gráfica de Radiación</div>
        <i id="closeIcon" class="fas fa-times"></i>
        <div class="pop-upImage">
          <img id="IrradianceGraph" src="" alt="Irradiance Graph">
        </div>
      </div>
    </div>


    <!-- Footer Section -->
    <div id="footerContainer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <script src="./ModulesJS/GraphCircleMain.js"></script>
    <script type="module" src="./callsAirQuality.js"></script>
    <script src="./Animation/sunrise.js"></script>
    <script src="./ModulesJS/pop-upGraph.js"></script>   
  </body>
</html>
